<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Izel and Franzen 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fde4ea;--bg2:#f7bccb;--card:#fff9fa;--ink:#8f0f33;--soft:#a85a73;--pill:#f3dce2;--line:#e9b8c6;--wine:#9b1239;--wine2:#c0345a;--shadow:rgba(155,18,57,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1018;--bg2:#1a0a10;--card:#331821;--ink:#ffc2d3;--soft:#d79ab0;--pill:#472233;--line:#6a3248;--wine:#e0517b;--wine2:#ff7b9f;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#2a1018;--bg2:#1a0a10;--card:#331821;--ink:#ffc2d3;--soft:#d79ab0;--pill:#472233;--line:#6a3248;--wine:#e0517b;--wine2:#ff7b9f;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
body{margin:0;min-height:100vh;font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-30px;opacity:0;color:var(--wine2);animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-110vh) rotate(20deg);opacity:0}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 16px 70px}
.card{background:var(--card);border-radius:34px;padding:34px 22px;margin-bottom:26px;text-align:center;box-shadow:0 12px 34px var(--shadow);border:1px solid var(--line);opacity:0;transform:translateY(26px);transition:.8s}
.card.in{opacity:1;transform:none}
.pill{display:inline-block;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:10px 22px;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
h1,h2{margin:20px 0 10px;font-weight:900;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
h1{font-size:2.3rem}h2{font-size:2rem}
.sub{color:var(--soft);font-size:1.1rem;margin:0}
.div{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0;color:var(--wine)}
.div::before,.div::after{content:"";width:52px;height:1px;background:var(--wine);opacity:.6}
/* message */
.msg{background:#fff;color:#111;border-radius:28px;padding:44px 20px;font-family:Georgia,"Times New Roman",serif;font-size:1.45rem;line-height:1.35;box-shadow:0 8px 24px var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg{background:#3d2029;color:#fff}}
:root[data-theme="dark"] .msg{background:#3d2029;color:#fff}
/* love test */
.lbl{display:block;text-align:left;font-size:.8rem;letter-spacing:.2em;font-weight:700;color:var(--soft);margin:18px 6px 8px}
input{width:100%;font:inherit;font-weight:700;font-size:1.15rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;outline:none}
input.them{background:var(--pill);border-style:dashed}
input:focus{border-color:var(--wine)}
.mid{width:46px;height:46px;border-radius:50%;background:var(--pill);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:16px auto 0;color:var(--wine)}
.btn{width:100%;margin-top:24px;border:0;border-radius:999px;background:var(--wine);color:#fff;font:inherit;font-weight:700;font-size:1.15rem;padding:20px;cursor:pointer;box-shadow:0 10px 22px var(--shadow)}
#res{max-height:0;overflow:hidden;transition:max-height .8s}
#res.on{max-height:320px}
.pct{font-size:4rem;font-weight:900;color:var(--wine);margin:22px 0 4px}
.bar{height:12px;border-radius:99px;background:var(--pill);overflow:hidden;margin:8px 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wine2),var(--wine));transition:width 1.4s}
/* moon */
.ring{width:min(78vw,300px);aspect-ratio:1;margin:26px auto 20px;border-radius:50%;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center}
.ring svg{width:74%;filter:drop-shadow(0 0 22px rgba(255,236,190,.5))}
.bigpill{display:inline-block;background:var(--pill);border:1.5px solid var(--line);border-radius:999px;padding:16px 34px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:1.05rem}
.ill{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;color:var(--soft);font-size:1.1rem}
.ill i{display:block;width:84px;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--wine) var(--w,100%),var(--pill) 0)}
/* reason */
.reason{font-size:1.3rem;line-height:1.5;margin:20px 6px 0;font-weight:500}
/* time */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.grid div{background:linear-gradient(var(--card),var(--pill));border:1px solid var(--line);border-bottom:6px solid var(--wine);border-radius:24px;padding:20px 4px 16px}
.grid b{display:block;font-size:2.3rem;font-weight:900;font-variant-numeric:tabular-nums}
.grid span{font-size:.72rem;letter-spacing:.2em;font-weight:700;color:var(--soft);text-transform:uppercase}
.dp{display:inline-block;background:var(--wine);color:#fff;border-radius:999px;padding:16px 30px;font-weight:700;font-size:1.1rem;margin-top:26px;box-shadow:0 8px 20px var(--shadow)}
.dp2{display:inline-block;background:var(--pill);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:14px 26px;font-size:1.05rem;margin-top:14px}
/* envelope */
.env{position:relative;width:min(100%,360px);aspect-ratio:1.5;margin:10px auto 22px;cursor:pointer;perspective:900px}
.env .body{position:absolute;inset:0;border-radius:18px;background:linear-gradient(135deg,#f3c7d3,#ecb2c3);border:1.5px solid var(--line);box-shadow:0 14px 30px var(--shadow);overflow:hidden}
.env .body::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.5%,rgba(255,255,255,.55) 50%) left bottom/50% 100% no-repeat,linear-gradient(to top left,transparent 49.5%,rgba(255,255,255,.55) 50%) right bottom/50% 100% no-repeat;opacity:.8}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(var(--wine),#b02049);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index .8s;z-index:3;border-radius:18px 18px 0 0}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c0345a,var(--wine));border:4px solid #f3c7d3;color:#fff;font-weight:900;font-size:1.4rem;display:flex;align-items:center;justify-content:center;z-index:4;transition:.5s;box-shadow:0 8px 16px rgba(0,0,0,.25)}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.stamp{position:absolute;right:14px;top:14px;width:42px;height:50px;background:#fff;border:2px dashed var(--wine);border-radius:4px;color:var(--wine);display:flex;align-items:center;justify-content:center;transform:rotate(6deg);z-index:4}
.tap{display:inline-block;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:14px 28px;color:var(--soft);font-size:1.1rem;cursor:pointer}
#letter{max-height:0;overflow:hidden;opacity:0;transition:max-height 1.4s ease,opacity 1s}
#letter.on{max-height:3000px;opacity:1}
.paper{margin-top:26px;background:#fffdf7;color:#4a2430;border-radius:20px;padding:30px 22px;text-align:left;font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.75;box-shadow:inset 0 0 0 1px #f0d9c9,0 8px 22px var(--shadow)}
.paper p{margin:0 0 16px}
.paper .sg{margin:0;text-align:right;color:var(--wine);font-style:italic}
</style>
</head>
<body>
<div id="fx"></div>
<main>

  <section class="card"><div class="msg" id="msg"></div></section>

  <section class="card">
    <span class="pill">💞 Love Test</span>
    <h2>Compatibility Calculator</h2>
    <p class="sub">Enter your name to see how compatible you are</p>
    <div class="div">♡</div>
    <label class="lbl" for="n1">THEM</label>
    <input id="n1" class="them" autocomplete="off">
    <div class="mid">♥</div>
    <label class="lbl" for="n2">YOU</label>
    <input id="n2" autocomplete="off">
    <button class="btn" id="calc">Calculate Compatibility</button>
    <div id="res"><div class="pct" id="pct">0%</div><div class="bar"><i id="bar"></i></div><p class="sub" id="verdict" style="margin-top:14px"></p></div>
  </section>

  <section class="card">
    <span class="pill" id="mdate">🌙</span>
    <h2>The moon when we first talked</h2>
    <p class="sub">This is what the sky looked like</p>
    <div class="div">✦</div>
    <div class="ring"><svg id="moon" viewBox="0 0 220 220"></svg></div>
    <span class="bigpill" id="mname">● Full Moon</span>
    <div class="ill"><i id="mbar"></i><span id="mpct"></span></div>
  </section>

  <section class="card">
    <span class="pill">💌 1 Reason</span>
    <h2>Why I love you</h2>
    <p class="reason" id="reason"></p>
  </section>

  <section class="card">
    <span class="pill" id="since">💞 Since</span>
    <h2>Time Together</h2>
    <p class="sub" id="tsub"></p>
    <div class="grid" id="grid"></div>
    <div class="dp" id="dp">📅 days together</div><br>
    <div class="dp2" id="dp2">✨</div>
  </section>

  <section class="card">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Tap to open the letter">
      <div class="body"></div><div class="flap"></div><div class="stamp">♥</div><div class="seal">Us</div>
    </div>
    <span class="tap" id="tap">✉️ tap to open</span>
    <div id="letter"><div class="paper" id="paper"></div></div>
  </section>

</main>
<script>
/* ✏️ EDIT HERE */
var CFG={
  you:"Franzen", her:"Izel",
  msg:"HAPPY MONTHSARY BABYYYY!!! 💐",
  firstTalk:"2021-11-20T12:00:00Z",
  together:"2026-06-18T00:00:00",
  togetherLine:"Since the day we decided to get back together.",
  reason:"I love everything about you and the reason is unexplainable",
  letter:[
    "Happy monthsary, my babbyyyyy!",
    "Another month with you is another month of feeling so lucky to have someone like you in my life. Thank you for understanding me baby, and for loving me even on the days when I’m not at my best.",
    "I’m really sorry baby because these past few days di tayo gaano nakakapag usap. There are times that di ko natatanong kamusta araw mo and if kumain kana ba. Please know that it’s never because I love you any less. Love na love kita ng sobra baby. I don’t want my busy days to make you question your place in my life because you have a special place in my heart that no one else can take.",
    "Happy monthsary again, babyyyy! No matter how busy life gets, I hope we continue to choose each other, understand each other, and grow together. I’m so thankful that I have you, and I hope we get to celebrate many more months and years together. I love you so much, more than my busy days could ever show. Please be patient with me, my baby, and remember that even when my days are full, my heart will always have a place for you. I love you always and forever."
  ],
  sign:"— "+"Franzen 💖"
};
/* END EDIT */
var $=function(i){return document.getElementById(i)};
$("msg").textContent=CFG.msg;$("n1").value=CFG.you;$("n2").value=CFG.her;$("reason").textContent=CFG.reason;$("tsub").textContent=CFG.togetherLine;
$("paper").innerHTML=CFG.letter.map(function(p){return"<p>"+p+"</p>"}).join("")+'<p class="sg">'+CFG.sign+'</p>';

/* reveal + hearts */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12});
[].forEach.call(document.querySelectorAll(".card"),function(c){io.observe(c)});
function heart(){var e=document.createElement("span");e.className="h";e.textContent="♥";e.style.left=Math.random()*100+"%";e.style.fontSize=(10+Math.random()*18)+"px";var t=7+Math.random()*6;e.style.animationDuration=t+"s";$("fx").appendChild(e);setTimeout(function(){e.remove()},t*1000)}
setInterval(heart,1100);
function burst(n){for(var i=0;i<n;i++)setTimeout(heart,i*70)}

/* compatibility */
$("calc").onclick=function(){
  var a=($("n1").value||"").trim().toLowerCase(),b=($("n2").value||"").trim().toLowerCase();
  if(!a||!b){$("verdict").textContent="Type both names first 💗";$("res").classList.add("on");return}
  var s=[a,b].sort().join("|"),h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  var p=90+(h%11); // fun result: always 90–100
  $("res").classList.add("on");$("bar").style.width="0";
  var n=0,t=setInterval(function(){n+=2;if(n>=p){n=p;clearInterval(t)}$("pct").textContent=n+"%"},25);
  setTimeout(function(){$("bar").style.width=p+"%"},50);
  $("verdict").textContent=p>=98?"Written in the stars ✨":p>=94?"A match made in heaven 💖":"Sweet, steady, and so right together 💕";
  burst(14);
};

/* moon */
(function(){
  var d=new Date(CFG.firstTalk),syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);
  var p=(((d.getTime()-ref)/864e5)%syn+syn)%syn/syn,k=Math.cos(2*Math.PI*p),ill=(1-k)/2,r=100,c=110;
  var rx=Math.abs(k)*r,sw=k>0?0:1;
  var lit="M"+c+","+(c-r)+" A"+r+","+r+" 0 0 1 "+c+","+(c+r)+" A"+rx+","+r+" 0 0 "+sw+" "+c+","+(c-r)+"Z";
  var cr=[[88,80,10],[120,118,8],[92,140,7],[140,86,5],[104,60,4],[130,150,6]].map(function(x){return'<circle cx="'+x[0]+'" cy="'+x[1]+'" r="'+x[2]+'" fill="#b9ab90" opacity=".45"/>'}).join("");
  var g='<defs><radialGradient id="mg" cx="40%" cy="35%"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#e4d9bf"/></radialGradient><clipPath id="mc"><circle cx="'+c+'" cy="'+c+'" r="'+r+'"/></clipPath></defs>';
  var flip=p>=.5?' transform="translate(220,0) scale(-1,1)"':'';
  $("moon").innerHTML=g+'<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="#6b3a4a" opacity=".55"/><g clip-path="url(#mc)"><g'+flip+'><path d="'+lit+'" fill="url(#mg)"/>'+cr+'</g></g><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#9b1239" stroke-width="3"/>';
  var nm=ill>=.97?"Full Moon":ill<=.03?"New Moon":p<.5?(ill<.45?"Waxing Crescent":ill<.55?"First Quarter":"Waxing Gibbous"):(ill>.55?"Waning Gibbous":ill>.45?"Last Quarter":"Waning Crescent");
  $("mname").textContent="● "+nm;$("mpct").textContent=Math.round(ill*100)+"% illuminated";$("mbar").style.setProperty("--w",Math.round(ill*100)+"%");
  $("mdate").textContent="🌙 "+d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).toUpperCase();
})();

/* time together */
(function(){
  var s=new Date(CFG.together);
  $("since").textContent="💞 SINCE "+s.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}).toUpperCase();
  var ms=[100,250,500,1000,1500];
  function z(n){return n<10?"0"+n:""+n}
  function tick(){
    var n=new Date(),y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth(),d=n.getDate()-s.getDate(),h=n.getHours()-s.getHours(),mi=n.getMinutes()-s.getMinutes(),se=n.getSeconds()-s.getSeconds();
    if(se<0){se+=60;mi--}if(mi<0){mi+=60;h--}if(h<0){h+=24;d--}
    if(d<0){d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();m--}if(m<0){m+=12;y--}
    if(y<0){y=m=d=h=mi=se=0}
    $("grid").innerHTML=[[y,"Years"],[m,"Months"],[d,"Days"],[h,"Hours"],[mi,"Minutes"],[se,"Seconds"]].map(function(x){return"<div><b>"+z(x[0])+"</b><span>"+x[1]+"</span></div>"}).join("");
    var days=Math.max(0,Math.floor((n-s)/864e5)),nx=ms.find(function(v){return v>days})||days+100;
    $("dp").textContent="📅 "+days+" days together";$("dp2").textContent="✨ "+(nx-days)+" days to "+nx+" days together";
  }
  tick();setInterval(tick,1000);
})();

/* envelope */
function openEnv(){var e=$("env");if(e.classList.contains("open"))return;e.classList.add("open");$("tap").textContent="💗 for you";burst(24);setTimeout(function(){$("letter").classList.add("on")},500)}
$("env").onclick=openEnv;$("tap").onclick=openEnv;$("env").onkeydown=function(e){if(e.key==="Enter"||e.key===" ")openEnv()};
</script>
</body>
</html>
